# GitHub Actions: 保持 GitHub Pages 活跃
# 每 15 分钟 ping 一次网站，防止 GitHub Pages 缓存问题

name: Keep GitHub Pages Alive

on:
  schedule:
    # 每 15 分钟执行一次（UTC 时间）
    - cron: '*/15 * * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping GitHub Pages
        run: |
          # GitHub Pages URL
          PAGES_URL="https://DEDIPLINE.github.io/fund-daily/"
          
          echo "🔄 Pinging GitHub Pages: $PAGES_URL"
          
          # 发送请求（忽略响应内容，只要不超时就行）
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$PAGES_URL" || echo "000")
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ GitHub Pages 状态正常 (HTTP $HTTP_CODE)"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "⚠️ GitHub Pages 可能正在部署中，请稍后重试"
          else
            echo "⚠️ GitHub Pages 返回 HTTP $HTTP_CODE"
          fi