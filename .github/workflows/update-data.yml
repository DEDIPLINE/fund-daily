name: Update Fund Data

on:
  schedule:
    # 暂时禁用定时任务，避免频繁失败邮件
    # 每个交易日北京时间 11:30 更新数据（盘中估值）
    # - cron: '30 3 * * 1-5'  # UTC 03:30 = 北京时间 11:30
    # 每个交易日北京时间 16:00 更新数据（收盘后全量）
    # - cron: '0 8 * * 1-5'   # UTC 08:00 = 北京时间 16:00
  workflow_dispatch:  # 允许手动触发

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        echo "=== Python 环境信息 ==="
        python --version
        pip list | grep -E "(akshare|flask|apscheduler)"
        
    - name: Update dashboard data
      run: |
        echo "=== 开始更新数据 ==="
        echo "当前时间: $(date)"
        echo "当前目录: $(pwd)"
        echo "文件列表:"
        ls -la
        
        # 运行数据更新
        python main.py export
        
        echo "=== 数据更新完成 ==="
        
        # 检查更新结果
        echo "=== 检查更新结果 ==="
        if [ -f "data/dashboard.json" ]; then
          echo "✅ dashboard.json 文件存在"
          echo "文件大小: $(wc -c < data/dashboard.json) bytes"
          echo "最后修改时间: $(stat -c %y data/dashboard.json)"
          
          # 检查数据内容
          echo "=== 数据内容检查 ==="
          python -c "
import json
try:
    with open('data/dashboard.json', 'r', encoding='utf-8') as f:
        data = json.load(f)
    print(f'✅ JSON 解析成功')
    print(f'生成时间: {data.get(\"generatedAt\", \"未知\")}')
    print(f'持仓数量: {len(data.get(\"holdings\", []))}')
    print(f'数据键: {list(data.keys())}')
except Exception as e:
    print(f'❌ JSON 解析失败: {e}')
"
        else
          echo "❌ dashboard.json 文件不存在"
          echo "当前目录内容:"
          ls -la data/
        fi
        
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/dashboard.json
        git diff --staged --quiet || git commit -m "Update dashboard data $(date +'%Y-%m-%d')"
        git push