name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 只上传静态文件，排除 Python 代码和数据目录（数据通过 update-data 工作流更新）
          path: .
          # 排除不需要的文件和目录
          exclude: |
            .git
            .github
            *.py
            src/
            tests/
            __pycache__/
            .pytest_cache/
            *.md
            LICENSE
            Dockerfile
            HF_SPACES_DEPLOY.md
            GITHUB_PAGES_DEPLOY.md
            config.example.json
            portfolio.json
            .gitignore
            
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
